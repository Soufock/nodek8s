apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: k8s-node-demo

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: k8s-node-demo

  minReplicas: 3
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 1