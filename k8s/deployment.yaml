apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-node-demo
spec:
  replicas: 3

  selector:
    matchLabels:
      app: k8s-node-demo

  template:
    metadata:
      labels:
        app: k8s-node-demo

    spec:
      containers:
        - name: app
          image: k8s-node-demo:1.0.3

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: k8s-node-demo-config
                  key: APP_ENV

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password

            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: k8s-node-demo-config
                  key: APP_NAME

            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10